<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLP Page B</title>
<style>:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,sans-serif;background:#080914;color:#f7f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 20%,#28205b 0,transparent 36%),#080914}main{width:min(720px,100%);border:1px solid #343750;background:#10111f;padding:clamp(28px,7vw,72px);box-shadow:0 24px 80px #0008}span{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:#8fe8ff}h1{font-size:clamp(2.4rem,8vw,5rem);line-height:.95;margin:.55em 0 .28em}p{font-size:clamp(1rem,2.2vw,1.3rem);line-height:1.65;color:#c6c8db;margin:0;max-width:36rem}.status{margin-top:2rem;font-size:.75rem;color:#8b90aa}</style></head><body><main><span>GLP demo page B</span><h1 id="title">Loading…</h1><p id="copy">Loading published copy.</p><p class="status" id="status" aria-live="polite"></p></main>
<script type="module">const bust=new URL(location.href).searchParams.get('release')||Date.now();fetch('./content.json?v='+encodeURIComponent(bust),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('content');return r.json()}).then(c=>{document.title=c.heroTitle+' · GLP Page B';document.querySelector('#title').textContent=c.heroTitle;document.querySelector('#copy').textContent=c.bodyCopy;document.querySelector('#status').textContent='Published revision '+c.revision}).catch(()=>{document.querySelector('#title').textContent='Page unavailable';document.querySelector('#copy').textContent='Published content could not be loaded.'})</script></body></html>
