<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLP Page B</title>
<style>:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,sans-serif;background:#080914;color:#f7f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 20%,#28205b 0,transparent 36%),#080914}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.7fr);gap:32px;width:min(920px,100%);border:1px solid #343750;background:#10111f;padding:clamp(28px,7vw,72px);box-shadow:0 24px 80px #0008}.eyebrow{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:#8fe8ff}h1{font-size:clamp(2.4rem,8vw,5rem);line-height:.95;margin:.55em 0 .28em}p{font-size:clamp(1rem,2.2vw,1.3rem);line-height:1.65;color:#c6c8db;margin:0;max-width:36rem}.action{display:inline-flex;margin-top:24px;padding:12px 18px;color:#061018;background:#8fe8ff;border-radius:8px;font-weight:800;text-decoration:none}.hero{width:100%;height:100%;min-height:260px;object-fit:cover;border:1px solid #3f4260;border-radius:14px}.highlights{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}.highlights li{padding:8px 12px;border:1px solid #343750;border-radius:999px;color:#c6c8db}.status{grid-column:1/-1;margin-top:1rem;font-size:.75rem;color:#8b90aa}[hidden]{display:none!important}@media(max-width:700px){main{grid-template-columns:1fr}.hero{min-height:200px}.highlights,.status{grid-column:1}}</style></head><body><main><section><span class="eyebrow">GLP demo page B</span><h1 id="title">Loading…</h1><p id="copy">Loading published copy.</p><a class="action" id="action" hidden></a></section><img class="hero" id="hero" alt="" hidden><ul class="highlights" id="highlights" hidden></ul><p class="status" id="status" aria-live="polite"></p></main>
<script type="module">const bust=new URL(location.href).searchParams.get('release')||Date.now();const safeHttps=value=>{try{const url=new URL(value);return url.protocol==='https:'&&!url.username&&!url.password}catch{return false}};const safeImage=value=>typeof value==='string'&&((value.startsWith('/assets/')&&!value.includes('..')&&!value.includes('\\')&&!/[?#]/.test(value))||safeHttps(value));fetch('./content.json?v='+encodeURIComponent(bust),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('content');return r.json()}).then(c=>{document.title=c.heroTitle+' · GLP Page B';document.querySelector('#title').textContent=c.heroTitle;document.querySelector('#copy').textContent=c.bodyCopy;const action=document.querySelector('#action');if(c.primaryActionLabel&&safeHttps(c.primaryActionUrl)){action.textContent=c.primaryActionLabel;action.href=c.primaryActionUrl;action.hidden=false}const hero=document.querySelector('#hero');if(safeImage(c.heroImage)){hero.src=c.heroImage;hero.hidden=false}const highlights=document.querySelector('#highlights');if(c.showHighlights&&Array.isArray(c.highlights)&&c.highlights.length){c.highlights.slice(0,6).forEach(value=>{if(typeof value!=='string'||!value.trim())return;const item=document.createElement('li');item.textContent=value;highlights.append(item)});highlights.hidden=highlights.children.length===0}document.querySelector('#status').textContent='Published revision '+c.revision}).catch(()=>{document.querySelector('#title').textContent='Page unavailable';document.querySelector('#copy').textContent='Published content could not be loaded.'})</script></body></html>
